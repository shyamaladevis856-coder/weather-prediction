<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register - Weather Prediction ML</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="auth"><div class="auth-box">
  <div class="logo">🌦️</div><h1>Create account</h1><p class="sub">Join Smart Weather Prediction</p>
  {% with msgs = get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}
  <form method="post">
    <label>Full name</label><input name="name" required placeholder="Your name">
    <label>Email</label><input type="email" name="email" required placeholder="you@example.com">
    <label>Password (min 6 characters)</label><input type="password" name="password" required minlength="6">
    <button class="btn">Register</button>
  </form>
  <p class="alt">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div></div></body></html>

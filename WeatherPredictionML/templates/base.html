<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Dashboard{% endblock %} - Weather Prediction ML</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script></head>
<body>
<nav><div class="brand">⛅ Weather Prediction ML</div>
  <div class="links">
    <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint=='dashboard' }}">Dashboard</a>
    <a href="{{ url_for('history') }}" class="{{ 'active' if request.endpoint=='history' }}">History</a>
    <span style="color:var(--muted)">👤 {{ session['name'] }}</span>
    <a href="{{ url_for('logout') }}">Logout</a>
  </div></nav>
<div class="wrap">{% block content %}{% endblock %}</div>
{% block scripts %}{% endblock %}
</body></html>
